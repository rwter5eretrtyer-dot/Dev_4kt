apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: kt4
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      default_type text/plain;
      location / {
        return 200 "KT-4 DevSecOps: Nginx HTTP works\n";
      }
    }
    server {
      listen 443 ssl;
      server_name _;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      default_type text/plain;
      location / {
        return 200 "KT-4 DevSecOps: Nginx HTTPS works\n";
      }
    }
