---
# Initialize exactly one control plane and install Flannel CNI.
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  gather_facts: true

  tasks:
    - name: Check if Kubernetes control plane exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Run kubeadm init with Flannel-compatible Pod CIDR
      ansible.builtin.command:
        cmd: >-
          kubeadm init
          --apiserver-advertise-address={{ ansible_host }}
          --pod-network-cidr=10.244.0.0/16
          --service-cidr=10.96.0.0/12
          --cri-socket=unix:///run/containerd/containerd.sock
      when: not admin_conf.stat.exists

    - name: Create admin kubectl directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: '0700'

    - name: Copy cluster admin kubeconfig to SSH user's home
      ansible.builtin.copy:
        remote_src: true
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: '{{ ansible_user }}'
        group: '{{ ansible_user }}'
        mode: '0600'

    - name: Apply pinned Flannel network manifest
      ansible.builtin.command:
        cmd: kubectl apply -f https://github.com/flannel-io/flannel/releases/download/v0.28.9/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"
