---
# Prepare three clean Ubuntu 22.04/24.04 nodes for Kubernetes.
- name: Prepare nodes with Docker Engine, containerd and Kubernetes v1.37
  hosts: k8s
  become: true
  gather_facts: true

  tasks:
    # Abort on unsupported operating systems.
    - name: Check Ubuntu version and architecture
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('22.04', '>=')
          - ansible_architecture == 'x86_64'
        fail_msg: 'This lab requires Ubuntu 22.04+ x86_64.'

    # Refresh apt and install base dependencies including bridge-utils.
    - name: Install base tools
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - bridge-utils
          - ca-certificates
          - curl
          - gpg
          - openssl
          - python3
        state: present
        update_cache: true

    # Kubelet defaults to rejecting swap-enabled hosts.
    - name: Turn off active swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: true

    - name: Disable swap in fstab for future reboots
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n]\S*\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    # Persist kernel module loading.
    - name: Create module list for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kt4-kubernetes.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load overlay module
      ansible.builtin.command: modprobe overlay
      changed_when: false

    - name: Load bridge netfilter module
      ansible.builtin.command: modprobe br_netfilter
      changed_when: false

    # Pod networking and iptables forwarding prerequisites.
    - name: Configure sysctl parameters
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kt4-kubernetes.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      notify: Apply sysctl

    # Install Docker from the official signed Ubuntu apt repository.
    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: kt4-docker
        state: present

    - name: Install Docker Engine and containerd runtime
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    # Create version-independent config for containerd 1.x or 2.x.
    - name: Generate containerd default config
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Enable CRI and systemd cgroups in containerd
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: '0644'
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
      notify: Restart containerd

    - name: Enable Docker Engine
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    # Add Kubernetes repo for the supported v1.37 minor release.
    - name: Download Kubernetes repository key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes repository
      ansible.builtin.apt_repository:
        repo: 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /'
        filename: kt4-kubernetes
        state: present

    - name: Install kubelet kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages from unexpected major updates
      ansible.builtin.dpkg_selections:
        name: '{{ item }}'
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet for boot
      ansible.builtin.service:
        name: kubelet
        enabled: true

    - name: Apply any pending service changes before kubeadm
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        enabled: true
        state: restarted
