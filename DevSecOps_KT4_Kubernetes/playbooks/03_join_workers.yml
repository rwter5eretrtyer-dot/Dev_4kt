---
# Join nodes securely using a short-lived token kept in Ansible memory.
- name: Create a short-lived worker join command
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Generate Kubernetes join token valid for 30 minutes
      ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
      register: ephemeral_join
      no_log: true
      changed_when: false

- name: Join the worker nodes
  hosts: workers
  become: true
  gather_facts: false
  tasks:
    - name: Detect existing Kubernetes worker membership
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_conf

    - name: Join worker to control plane
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['control_plane'][0]].ephemeral_join.stdout }} --cri-socket=unix:///run/containerd/containerd.sock"
      when: not worker_kubelet_conf.stat.exists
      no_log: true
