---
# Deploy a 6-replica nginx app with separate HTTP and real TLS HTTPS services.
- name: Install Nginx workload and expose two internal services
  hosts: control_plane
  become: true
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Create app manifest directory
      ansible.builtin.file:
        path: /opt/kt4-k8s
        state: directory
        mode: '0755'

    - name: Create protected directory for the lab TLS certificate
      ansible.builtin.file:
        path: /root/kt4-tls
        state: directory
        mode: '0700'

    - name: Copy Kubernetes resources to the control plane
      ansible.builtin.copy:
        src: "../k8s/{{ item }}"
        dest: "/opt/kt4-k8s/{{ item }}"
        mode: '0644'
      loop:
        - 00-namespace.yaml
        - 01-configmap.yaml
        - 02-deployment.yaml
        - 03-service-http.yaml
        - 04-service-https.yaml

    - name: Apply namespace manifest
      ansible.builtin.command: kubectl apply -f /opt/kt4-k8s/00-namespace.yaml
      register: ns_result
      changed_when: "'created' in ns_result.stdout or 'configured' in ns_result.stdout"

    - name: Generate temporary self-signed certificate for teaching purposes
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -days
          - '30'
          - -keyout
          - /root/kt4-tls/tls.key
          - -out
          - /root/kt4-tls/tls.crt
          - -subj
          - /CN=nginx-https
        creates: /root/kt4-tls/tls.crt
      no_log: true

    - name: Protect private TLS key
      ansible.builtin.file:
        path: /root/kt4-tls/tls.key
        mode: '0600'

    - name: Create TLS Secret without committing key material
      ansible.builtin.shell: |
        kubectl -n kt4 create secret tls nginx-tls \
          --cert=/root/kt4-tls/tls.crt \
          --key=/root/kt4-tls/tls.key \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash
      register: tls_apply
      changed_when: "'created' in tls_apply.stdout or 'configured' in tls_apply.stdout"
      no_log: true

    - name: Apply ConfigMap containing Nginx listeners
      ansible.builtin.command: kubectl apply -f /opt/kt4-k8s/01-configmap.yaml
      register: configmap_result
      changed_when: "'created' in configmap_result.stdout or 'configured' in configmap_result.stdout"

    - name: Apply 6-replica Deployment
      ansible.builtin.command: kubectl apply -f /opt/kt4-k8s/02-deployment.yaml
      register: deployment_result
      changed_when: "'created' in deployment_result.stdout or 'configured' in deployment_result.stdout"

    - name: Publish internal HTTP service
      ansible.builtin.command: kubectl apply -f /opt/kt4-k8s/03-service-http.yaml
      register: http_result
      changed_when: "'created' in http_result.stdout or 'configured' in http_result.stdout"

    - name: Publish internal HTTPS service
      ansible.builtin.command: kubectl apply -f /opt/kt4-k8s/04-service-https.yaml
      register: https_result
      changed_when: "'created' in https_result.stdout or 'configured' in https_result.stdout"

    - name: Wait for six available Nginx replicas
      ansible.builtin.command: kubectl -n kt4 rollout status deployment/nginx --timeout=300s
      changed_when: false
